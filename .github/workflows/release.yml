name: Release

on:
  push:
    tags:
      - 'v*'
      - 'community-v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  stable-release-preflight:
    name: Stable release credential gate
    runs-on: ubuntu-22.04
    environment: release
    env:
      TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
      AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
      AZURE_ARTIFACT_SIGNING_PROFILE_NAME: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE_NAME }}
      APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      CLIENT_CDN_BASE_URL: ${{ secrets.CLIENT_CDN_BASE_URL }}
      RELEASE_CHANNEL: ${{ startsWith(github.ref_name, 'community-v') && 'community' || 'stable' }}
    steps:
      - name: Refuse an unsigned or unmirrored stable release
        shell: bash
        run: |
          set -euo pipefail
          required=(TAURI_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing stable release credential: $name" >&2
              exit 1
            fi
          done
          if [ "$RELEASE_CHANNEL" = community ]; then
            echo "Community preview release: OS vendor certificates and domestic mirror credentials are optional"
            exit 0
          fi
          stable_required=(APPLE_CERT APPLE_CERT_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID KEYCHAIN_PASSWORD OSS_ACCESS_KEY_ID OSS_ACCESS_KEY_SECRET OSS_ENDPOINT OSS_BUCKET CLIENT_CDN_BASE_URL)
          for name in "${stable_required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing stable release credential: $name" >&2
              exit 1
            fi
          done
          if [ -n "${WINDOWS_CERT:-}" ] && [ -n "${WINDOWS_CERT_PASSWORD:-}" ]; then
            echo "Windows signing mode: PFX"
          else
            azure_required=(AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_ARTIFACT_SIGNING_ENDPOINT AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME AZURE_ARTIFACT_SIGNING_PROFILE_NAME)
            for name in "${azure_required[@]}"; do
              if [ -z "${!name:-}" ]; then
                echo "Missing Windows signing credential: provide the PFX pair or all Azure Artifact Signing values; missing $name" >&2
                exit 1
              fi
            done
            echo "Windows signing mode: Azure Artifact Signing"
          fi

  release:
    runs-on: ${{ matrix.os }}
    environment: release
    needs: stable-release-preflight
    env:
      RELEASE_CHANNEL: ${{ startsWith(github.ref_name, 'community-v') && 'community' || 'stable' }}
      WINDOWS_SIGNING_MODE: ${{ startsWith(github.ref_name, 'community-v') && 'unsigned' || (secrets.AZURE_CLIENT_ID != '' && 'azure' || 'pfx') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
          - os: ubuntu-22.04
          - os: ubuntu-22.04-arm
            arch: arm64
          - os: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          # Core build tools and pkg-config
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            patchelf \
            libssl-dev \
            rpm \
            flatpak \
            flatpak-builder \
            elfutils \
            xdg-utils
          # GTK/GLib stack for gdk-3.0, glib-2.0, gio-2.0
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev
          # WebKit2GTK (version differs across Ubuntu images; try 4.1 then 4.0)
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          # libsoup also changed major version; prefer 3.0 with fallback to 2.4
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Prepare Tauri signing key
        shell: bash
        run: |
          # 调试：检查 Secret 是否存在
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "❌ TAURI_SIGNING_PRIVATE_KEY Secret 为空或不存在" >&2
            echo "请检查 GitHub 仓库 Settings > Secrets and variables > Actions" >&2
            exit 1
          fi
          
          RAW="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          # 目标：提供正确的私钥“文件路径”给 Tauri CLI，避免内容解码歧义
          KEY_PATH="$RUNNER_TEMP/tauri_signing.key"
          # 情况 1：原始两行文本（第一行以 "untrusted comment:" 开头）
          if echo "$RAW" | head -n1 | grep -q '^untrusted comment:'; then
            printf '%s\n' "$RAW" > "$KEY_PATH"
            echo "✅ 使用原始两行密钥文件格式"
          else
            # 情况 2：整体被 base64 包裹（解包后应当是两行）
            if DECODED=$(printf '%s' "$RAW" | (base64 --decode 2>/dev/null || base64 -D 2>/dev/null)) \
               && echo "$DECODED" | head -n1 | grep -q '^untrusted comment:'; then
              printf '%s\n' "$DECODED" > "$KEY_PATH"
              echo "✅ 成功解码 base64 包裹密钥，已还原为两行文件"
            else
              # 情况 3：已是第二行（纯 Base64 一行）→ 构造两行文件
              if echo "$RAW" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
                ONE=$(printf '%s' "$RAW" | tr -d '\r\n')
                printf '%s\n%s\n' "untrusted comment: tauri signing key" "$ONE" > "$KEY_PATH"
                echo "✅ 使用一行 Base64 私钥，已构造两行文件"
              else
                echo "❌ TAURI_SIGNING_PRIVATE_KEY 格式无法识别：既不是两行原文，也不是其 base64，亦非一行 base64" >&2
                exit 1
              fi
            fi
          fi
          # 将“完整两行内容”作为环境变量注入（Tauri 支持传入完整私钥文本或文件路径）
          # 使用多行写入语法，保持换行以便解析
          # 将完整两行私钥内容进行 base64 编码，作为单行内容注入环境变量
          if command -v base64 >/dev/null 2>&1; then
            KEY_B64=$(base64 < "$KEY_PATH" | tr -d '\r\n')
          elif command -v openssl >/dev/null 2>&1; then
            KEY_B64=$(openssl base64 -A -in "$KEY_PATH")
          else
            KEY_B64=$(KEY_PATH="$KEY_PATH" node -e "process.stdout.write(require('fs').readFileSync(process.env.KEY_PATH).toString('base64'))")
          fi
          if [ -z "$KEY_B64" ]; then
            echo "❌ 无法生成私钥 base64 内容" >&2
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_B64" >> "$GITHUB_ENV"
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> $GITHUB_ENV
          fi
          echo "✅ Tauri signing key prepared"

      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.RELEASE_CHANNEL == 'stable'
        shell: bash
        run: |
          set -euo pipefail
          # Decode .p12 certificate from base64
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          printf '%s' "${{ secrets.APPLE_CERTIFICATE }}" | (base64 --decode 2>/dev/null || base64 -D) > "$CERT_PATH"

          # Save original default keychain for cleanup
          ORIGINAL_DEFAULT_KEYCHAIN=$(security default-keychain -d user | tr -d '"' | xargs)
          echo "ORIGINAL_DEFAULT_KEYCHAIN=$ORIGINAL_DEFAULT_KEYCHAIN" >> "$GITHUB_ENV"

          # Create temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" "$KEYCHAIN_PATH"

          # Import certificate
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${{ secrets.KEYCHAIN_PASSWORD }}" "$KEYCHAIN_PATH"

          # Dynamically resolve signing identity (must be "Developer ID Application")
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | grep -oE '"[^"]+"' | head -1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            echo "❌ No 'Developer ID Application' identity found — listing all identities:" >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "✅ Signing identity: $IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          # Cleanup certificate file
          rm -f "$CERT_PATH"

      - name: Build Tauri App (macOS stable)
        if: runner.os == 'macOS' && env.RELEASE_CHANNEL == 'stable'
        shell: bash
        timeout-minutes: 60
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "=== macOS build/notarization attempt ${attempt}/${max_attempts} ==="
            if pnpm tauri build --target universal-apple-darwin; then
              echo "✅ macOS build/notarization succeeded"
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "❌ macOS build/notarization failed after ${max_attempts} attempts" >&2
              exit 1
            fi

            sleep_seconds=$((attempt * 60))
            echo "⚠️ macOS build/notarization failed, retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done

      - name: Build Tauri App (macOS community preview)
        if: runner.os == 'macOS' && env.RELEASE_CHANNEL == 'community'
        shell: bash
        timeout-minutes: 60
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: |
          set -euo pipefail
          pnpm tauri build --target universal-apple-darwin

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: x86_64
        run: |
          $ErrorActionPreference = 'Stop'
          $targetDirectory = 'src-tauri/target/release'
          pnpm tauri build --no-bundle
          $executable = Get-ChildItem -Path $targetDirectory -Filter '*.exe' -File | Where-Object { $_.Name -notmatch 'build-script' } | Select-Object -First 1
          if (-not $executable) { throw 'Windows executable was not produced' }
          "WINDOWS_EXE_PATH=$($executable.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Azure login for Windows signing
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_MODE == 'azure'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows executable with Azure Artifact Signing
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_MODE == 'azure'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE_NAME }}
          files: ${{ github.workspace }}\src-tauri\target\release\sub2api-client.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign Windows executable with PFX
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_MODE == 'pfx'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $certificatePath = Join-Path $env:RUNNER_TEMP 'windows-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD "$env:WINDOWS_EXE_PATH"

      - name: Verify Windows executable signature
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_MODE != 'unsigned'
        shell: pwsh
        run: signtool verify /pa /v "$env:WINDOWS_EXE_PATH"

      - name: Bundle Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm tauri bundle --bundles msi
          $msi = Get-ChildItem -Path 'src-tauri/target/release/bundle/msi' -Filter '*.msi' -File | Select-Object -First 1
          if (-not $msi) { throw 'Windows MSI was not produced' }
          "WINDOWS_MSI_PATH=$($msi.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Sign Windows MSI with Azure Artifact Signing
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_MODE == 'azure'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\src-tauri\target\release\bundle\msi
          files-folder-filter: '*.msi'
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign Windows MSI with PFX
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_MODE == 'pfx'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $certificatePath = Join-Path $env:RUNNER_TEMP 'windows-signing.pfx'
          & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD "$env:WINDOWS_MSI_PATH"
          Remove-Item $certificatePath -Force

      - name: Verify Windows MSI signature
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_MODE != 'unsigned'
        shell: pwsh
        run: signtool verify /pa /v "$env:WINDOWS_MSI_PATH"

      - name: Build Tauri App (Linux)
        if: runner.os == 'Linux'
        run: pnpm tauri build --bundles appimage,deb,rpm

      - name: Prepare macOS Assets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME}"  # e.g., v3.5.0

          # Locate bundle artifacts
          TAR_GZ=""; APP_PATH=""
          for path in \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos" \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/x86_64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/release/bundle/macos"; do
            if [ -d "$path" ]; then
              [ -z "$TAR_GZ" ]   && TAR_GZ=$(find "$path" -maxdepth 1 -name "*.tar.gz" -type f | head -1 || true)
              [ -z "$APP_PATH" ] && APP_PATH=$(find "$path" -maxdepth 1 -name "*.app" -type d | head -1 || true)
            fi
          done

          if [ -z "$TAR_GZ" ]; then
            echo "❌ No macOS .tar.gz updater artifact found" >&2
            exit 1
          fi
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found" >&2
            exit 1
          fi

          if [ "$RELEASE_CHANNEL" = stable ]; then
            # Tauri notarized the app during the stable build.
            xcrun stapler staple "$APP_PATH"
            echo "✅ .app stapled"
          else
            # Free community builds are ad-hoc signed for bundle integrity only.
            codesign --force --deep --sign - "$APP_PATH"
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
            echo "✅ Community .app ad-hoc signature verified"
          fi

          # 1) Collect .tar.gz (updater artifact)
          NEW_TAR_GZ="Sub2API-Client-${VERSION}-macOS.tar.gz"
          cp "$TAR_GZ" "release-assets/$NEW_TAR_GZ"
          [ -f "$TAR_GZ.sig" ] && cp "$TAR_GZ.sig" "release-assets/$NEW_TAR_GZ.sig" || echo ".sig for macOS not found yet"
          echo "macOS updater artifact copied: $NEW_TAR_GZ"

          # 2) Collect .app as zip
          NEW_ZIP="Sub2API-Client-${VERSION}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release-assets/$NEW_ZIP"
          echo "macOS zip ready: $NEW_ZIP"

          # 3) Create styled DMG with create-dmg (Tauri's built-in DMG styling doesn't work on CI)
          if [ "$RELEASE_CHANNEL" = stable ] && [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "❌ APPLE_SIGNING_IDENTITY is missing before DMG creation" >&2
            exit 1
          fi
          DMG_SIGNING_IDENTITY="${APPLE_SIGNING_IDENTITY:--}"

          HOMEBREW_NO_AUTO_UPDATE=1 brew install create-dmg
          NEW_DMG="Sub2API-Client-${VERSION}-macOS.dmg"
          DMG_STAGE_DIR="$RUNNER_TEMP/dmg-stage"
          rm -rf "$DMG_STAGE_DIR"
          mkdir -p "$DMG_STAGE_DIR"
          ditto "$APP_PATH" "$DMG_STAGE_DIR/Sub2API Client.app"

          create-dmg \
            --volname "Sub2API Client" \
            --background "src-tauri/icons/dmg-background.png" \
            --window-size 660 400 \
            --window-pos 200 120 \
            --icon-size 80 \
            --icon "Sub2API Client.app" 180 220 \
            --hide-extension "Sub2API Client.app" \
            --app-drop-link 480 220 \
            --codesign "$DMG_SIGNING_IDENTITY" \
            --no-internet-enable \
            "release-assets/$NEW_DMG" \
            "$DMG_STAGE_DIR"

          rm -rf "$DMG_STAGE_DIR"
          echo "✅ Styled DMG created: $NEW_DMG"

      - name: Notarize macOS DMG
        if: runner.os == 'macOS' && env.RELEASE_CHANNEL == 'stable'
        shell: bash
        timeout-minutes: 30
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          DMG_PATH=$(find release-assets -maxdepth 1 -name "*.dmg" -type f | head -1 || true)
          if [ -z "$DMG_PATH" ]; then
            echo "❌ No .dmg found in release-assets/ to notarize" >&2
            exit 1
          fi

          echo "=== Notarizing DMG: $DMG_PATH ==="
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "=== DMG notarization attempt ${attempt}/${max_attempts} ==="
            if xcrun notarytool submit "$DMG_PATH" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait; then
              echo "✅ DMG notarization succeeded"
              xcrun stapler staple "$DMG_PATH"
              echo "✅ DMG stapled"
              break
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "❌ DMG notarization failed after ${max_attempts} attempts" >&2
              exit 1
            fi

            sleep_seconds=$((attempt * 60))
            echo "⚠️ DMG notarization failed, retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done

      - name: Verify macOS code signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          # Verify .app (from Tauri bundle)
          APP_PATH=""
          for path in \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos" \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/x86_64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/release/bundle/macos"; do
            if [ -d "$path" ]; then
              [ -z "$APP_PATH" ] && APP_PATH=$(find "$path" -maxdepth 1 -name "*.app" -type d | head -1 || true)
            fi
          done

          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found for verification" >&2
            exit 1
          fi
          echo "=== Verifying .app: $APP_PATH ==="
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "✅ codesign verification passed"
          if [ "$RELEASE_CHANNEL" = stable ]; then
            spctl -a -t exec -vv "$APP_PATH"
            echo "✅ spctl assessment passed"
            xcrun stapler validate "$APP_PATH"
            echo "✅ .app stapler validation passed"
          else
            echo "ℹ️ Community preview intentionally skips Gatekeeper and notarization checks"
          fi

          # Verify .dmg (from release-assets/, created by create-dmg + notarized)
          DMG_PATH=$(find release-assets -maxdepth 1 -name "*.dmg" -type f | head -1 || true)
          if [ -n "$DMG_PATH" ]; then
            echo "=== Verifying .dmg: $DMG_PATH ==="
            codesign --verify --verbose=2 "$DMG_PATH"
            echo "✅ .dmg codesign verification passed"
            if [ "$RELEASE_CHANNEL" = stable ]; then
              spctl -a -t open --context context:primary-signature -vv "$DMG_PATH"
              echo "✅ .dmg spctl assessment passed"
              xcrun stapler validate "$DMG_PATH"
              echo "✅ .dmg stapler validation passed"
            fi
          else
            echo "❌ No .dmg found for verification — release would ship without verified DMG" >&2
            exit 1
          fi

      - name: Prepare Windows Assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $VERSION = $env:GITHUB_REF_NAME  # e.g., v3.5.0
          $targetRoot = 'src-tauri/target/release'

          # 仅打包 MSI 安装器 + .sig（用于 Updater）
          $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle/msi') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $msi) {
            # 兜底：全局搜索 .msi
            $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($null -ne $msi) {
            $dest = "Sub2API-Client-$VERSION-Windows.msi"
            Copy-Item $msi.FullName (Join-Path release-assets $dest)
            Write-Host "Installer copied: $dest"
            $sigPath = "$($msi.FullName).sig"
            if (Test-Path $sigPath) {
              Copy-Item $sigPath (Join-Path release-assets ("$dest.sig"))
              Write-Host "Signature copied: $dest.sig"
            } else {
              throw "Tauri updater signature not found for $($msi.Name)"
            }
          } else {
            throw 'No Windows MSI installer found'
          }

          # 绿色版（portable）：仅可执行文件打 zip（不参与 Updater）
          $exePath = $env:WINDOWS_EXE_PATH
          if ($exePath -and (Test-Path $exePath)) {
            $portableDir = 'release-assets/Sub2API-Client-Portable'
            New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
            Copy-Item $exePath $portableDir
            $portableIniPath = Join-Path $portableDir 'portable.ini'
            $portableContent = @(
              '# Sub2API Client portable build marker',
              'portable=true'
            )
            $portableContent | Set-Content -Path $portableIniPath -Encoding UTF8
            $portableZip = "release-assets/Sub2API-Client-$VERSION-Windows-Portable.zip"
            Compress-Archive -Path "$portableDir/*" -DestinationPath $portableZip -Force
            Remove-Item -Recurse -Force $portableDir
            Write-Host "Windows portable zip created: Sub2API-Client-$VERSION-Windows-Portable.zip"
          } else {
            throw 'Portable exe not found'
          }

      - name: Prepare Linux Assets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME}"  # e.g., v3.5.0
          ARCH="${{ matrix.arch || 'x86_64' }}"
          # Updater artifact: AppImage（含对应 .sig）
          APPIMAGE=$(find src-tauri/target/release/bundle -name "*.AppImage" | head -1 || true)
          if [ -n "$APPIMAGE" ]; then
            NEW_APPIMAGE="Sub2API-Client-${VERSION}-Linux-${ARCH}.AppImage"
            cp "$APPIMAGE" "release-assets/$NEW_APPIMAGE"
            [ -f "$APPIMAGE.sig" ] && cp "$APPIMAGE.sig" "release-assets/$NEW_APPIMAGE.sig" || echo ".sig for AppImage not found"
            echo "AppImage copied: $NEW_APPIMAGE"
          else
            echo "No AppImage found under target/release/bundle" >&2
          fi
          # 额外上传 .deb（用于手动安装，不参与 Updater）
          DEB=$(find src-tauri/target/release/bundle -name "*.deb" | head -1 || true)
          if [ -n "$DEB" ]; then
            cp "$DEB" "release-assets/Sub2API-Client-${VERSION}-Linux-${ARCH}.deb"
            echo "Deb package copied: Sub2API-Client-${VERSION}-Linux-${ARCH}.deb"
          else
            echo "No .deb found (optional)"
          fi
          # 额外上传 .rpm（用于 Fedora/RHEL/openSUSE 等，不参与 Updater）
          RPM=$(find src-tauri/target/release/bundle -name "*.rpm" | head -1 || true)
          if [ -n "$RPM" ]; then
            cp "$RPM" "release-assets/Sub2API-Client-${VERSION}-Linux-${ARCH}.rpm"
            echo "RPM package copied: Sub2API-Client-${VERSION}-Linux-${ARCH}.rpm"
          else
            echo "No .rpm found (optional)"
          fi

      - name: List prepared assets
        shell: bash
        run: |
          ls -la release-assets || true

      - name: Collect Signatures
        shell: bash
        run: |
          set -euo pipefail
          echo "Collected signatures (if any alongside artifacts):"
          ls -la release-assets/*.sig || echo "No signatures found"

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ runner.os }}-${{ matrix.arch || runner.arch }}
          path: release-assets/*
          if-no-files-found: error

      - name: List generated bundles (debug)
        if: always()
        shell: bash
        run: |
          echo "Listing bundles in src-tauri/target..."
          find src-tauri/target -maxdepth 4 -type f -name "*.*" 2>/dev/null || true

      - name: Clean up Apple signing keychain
        if: runner.os == 'macOS' && always()
        shell: bash
        run: |
          if [ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" ]; then
            security default-keychain -s "$ORIGINAL_DEFAULT_KEYCHAIN" || true
          fi
          if [ -f "$RUNNER_TEMP/build.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          fi

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: release
    permissions:
      contents: write
    steps:
      - name: Download built release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: List downloaded release artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -la release-assets

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Sub2API Client ${{ github.ref_name }}
          prerelease: ${{ startsWith(github.ref_name, 'community-v') }}
          make_latest: ${{ startsWith(github.ref_name, 'community-v') && 'false' || 'true' }}
          body: |
            ## Sub2API Client ${{ github.ref_name }}

            🌐 **Only Official Website / 唯一官方网站 / 唯一の公式サイト**: [ai.tavonilo.com](https://ai.tavonilo.com)

            面向 ai.tavonilo.com 的 Codex 一键配置客户端。

            > ${{ startsWith(github.ref_name, 'community-v') && '⚠️ 社区预览版：Tauri 更新包签名与 SHA-256 校验有效，但 Windows 没有商业 Authenticode 证书，macOS 没有 Apple 公证。安装时会出现系统安全提示，请只从本站或本仓库下载。' || '✅ 正式稳定版：Windows Authenticode、macOS Developer ID 与 Apple 公证均已通过。' }}

            ### 下载

            - **macOS**: `Sub2API-Client-${{ github.ref_name }}-macOS.dmg`（推荐）或 `Sub2API-Client-${{ github.ref_name }}-macOS.zip`（解压即用）
            - **Windows (x86_64)**: `Sub2API-Client-${{ github.ref_name }}-Windows.msi`（安装版）或 `Sub2API-Client-${{ github.ref_name }}-Windows-Portable.zip`（绿色版）
            - **Linux (x86_64)**: `Sub2API-Client-${{ github.ref_name }}-Linux-x86_64.AppImage` / `.deb` / `.rpm`
            - **Linux (ARM64)**: `Sub2API-Client-${{ github.ref_name }}-Linux-arm64.AppImage` / `.deb` / `.rpm`

            > `.tar.gz` 为 Tauri updater 自动更新专用，无需手动下载。

            ### 社区预览版安装提示

            - Windows：优先使用 Portable ZIP；出现 SmartScreen 时核对 SHA-256 后选择“更多信息 → 仍要运行”。
            - macOS：右键应用并选择“打开”；仍被阻止时，在终端运行 `xattr -dr com.apple.quarantine '/Applications/Sub2API Client.app'`。
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  assemble-latest-json:
    name: Assemble latest.json
    runs-on: ubuntu-22.04
    needs: publish-release
    permissions:
      contents: write
    steps:
      - name: Prepare GH
        run: |
          gh --version || (type -p curl >/dev/null && sudo apt-get update && sudo apt-get install -y gh || true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dl
          gh release download "$TAG" --dir dl --repo "$GITHUB_REPOSITORY"
          ls -la dl || true
      - name: Generate latest.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if [[ "$TAG" == community-v* ]]; then
            VERSION="${TAG#community-v}"
          fi
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          base_url="https://github.com/$REPO/releases/download/$TAG"
          # 初始化空平台映射
          mac_url=""; mac_sig=""
          win_x64_url=""; win_x64_sig=""
          win_arm64_url=""; win_arm64_sig=""
          linux_x64_url=""; linux_x64_sig=""
          linux_arm64_url=""; linux_arm64_sig=""
          shopt -s nullglob
          for sig in dl/*.sig; do
            base=${sig%.sig}
            fname=$(basename "$base")
            url="$base_url/$fname"
            sig_content=$(cat "$sig")
            case "$fname" in
              *.tar.gz)
                # 视为 macOS updater artifact
                mac_url="$url"; mac_sig="$sig_content";;
              *-Windows-arm64.msi)
                win_arm64_url="$url"; win_arm64_sig="$sig_content";;
              *-Windows.msi)
                win_x64_url="$url"; win_x64_sig="$sig_content";;
              *-Linux-arm64.AppImage|*-Linux-arm64.appimage)
                linux_arm64_url="$url"; linux_arm64_sig="$sig_content";;
              *-Linux-x86_64.AppImage|*-Linux-x86_64.appimage)
                linux_x64_url="$url"; linux_x64_sig="$sig_content";;
            esac
          done
          # 构造 JSON（仅包含存在的目标）
          tmp_json=$(mktemp)
          {
            echo '{'
            echo "  \"version\": \"$VERSION\",";
            echo "  \"notes\": \"Release $TAG\",";
            echo "  \"pub_date\": \"$PUB_DATE\",";
            echo '  "platforms": {'
            first=1
            if [ -n "$mac_url" ] && [ -n "$mac_sig" ]; then
              # 为兼容 arm64 / x64，重复写入两个键，指向同一 universal 包
              for key in darwin-aarch64 darwin-x86_64; do
                [ $first -eq 0 ] && echo ','
                echo "    \"$key\": {\"signature\": \"$mac_sig\", \"url\": \"$mac_url\"}"
                first=0
              done
            fi
            if [ -n "$win_x64_url" ] && [ -n "$win_x64_sig" ]; then
              [ $first -eq 0 ] && echo ','
              echo "    \"windows-x86_64\": {\"signature\": \"$win_x64_sig\", \"url\": \"$win_x64_url\"}"
              first=0
            fi
            if [ -n "$win_arm64_url" ] && [ -n "$win_arm64_sig" ]; then
              [ $first -eq 0 ] && echo ','
              echo "    \"windows-aarch64\": {\"signature\": \"$win_arm64_sig\", \"url\": \"$win_arm64_url\"}"
              first=0
            fi
            if [ -n "$linux_x64_url" ] && [ -n "$linux_x64_sig" ]; then
              [ $first -eq 0 ] && echo ','
              echo "    \"linux-x86_64\": {\"signature\": \"$linux_x64_sig\", \"url\": \"$linux_x64_url\"}"
              first=0
            fi
            if [ -n "$linux_arm64_url" ] && [ -n "$linux_arm64_sig" ]; then
              [ $first -eq 0 ] && echo ','
              echo "    \"linux-aarch64\": {\"signature\": \"$linux_arm64_sig\", \"url\": \"$linux_arm64_url\"}"
              first=0
            fi
            echo '  }'
            echo '}'
          } > "$tmp_json"
          echo "Generated latest.json:" && cat "$tmp_json"
          mv "$tmp_json" latest.json
      - name: Upload latest.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber --repo "$GITHUB_REPOSITORY"

  publish-domestic-mirror:
    name: Publish download manifest and optional domestic mirror
    runs-on: ubuntu-22.04
    needs: assemble-latest-json
    environment: release
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      AWS_DEFAULT_REGION: cn-hangzhou
      AWS_EC2_METADATA_DISABLED: 'true'
      OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      CDN_BASE_URL: ${{ vars.CLIENT_CDN_BASE_URL || secrets.CLIENT_CDN_BASE_URL }}
      MIRROR_DEPLOY_HOST: ${{ secrets.MIRROR_DEPLOY_HOST }}
      MIRROR_DEPLOY_PORT: ${{ secrets.MIRROR_DEPLOY_PORT }}
      MIRROR_DEPLOY_USER: ${{ secrets.MIRROR_DEPLOY_USER }}
      MIRROR_DEPLOY_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_CHANNEL: ${{ startsWith(github.ref_name, 'community-v') && 'community' || 'stable' }}
    steps:
      - name: Checkout manifest generator
        uses: actions/checkout@v6

      - name: Download release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" --dir release-assets --repo "$GITHUB_REPOSITORY"

      - name: Generate and validate download manifest with SHA-256
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/generate-download-manifest.mjs release-assets client-download-manifest.json

      - name: Require site mirror deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          required=(CDN_BASE_URL MIRROR_DEPLOY_HOST MIRROR_DEPLOY_PORT MIRROR_DEPLOY_USER MIRROR_DEPLOY_KEY)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing client mirror deployment setting: $name" >&2
              exit 1
            fi
          done

      - name: Attach download manifest to GitHub Release
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" client-download-manifest.json --clobber --repo "$GITHUB_REPOSITORY"

      - name: Update fixed community manifest endpoint
        if: env.RELEASE_CHANNEL == 'community'
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view community-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create community-latest --repo "$GITHUB_REPOSITORY" --prerelease --title 'Sub2API Client community latest' --notes 'Mutable download-manifest pointer for the latest free community preview.'
          fi
          gh release upload community-latest client-download-manifest.json release-assets/latest.json --clobber --repo "$GITHUB_REPOSITORY"

      - name: Prepare verified site mirror payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "mirror-release/${GITHUB_REF_NAME}"
          cp release-assets/* "mirror-release/${GITHUB_REF_NAME}/"
          cp client-download-manifest.json latest.json mirror-release/

      - name: Upload site mirror staging payload
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.MIRROR_DEPLOY_HOST }}
          port: ${{ secrets.MIRROR_DEPLOY_PORT }}
          username: ${{ secrets.MIRROR_DEPLOY_USER }}
          key: ${{ secrets.MIRROR_DEPLOY_KEY }}
          source: mirror-release
          target: /home/sub2api-client-mirror/staging/${{ github.ref_name }}-${{ github.run_id }}

      - name: Validate and atomically publish site mirror
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.MIRROR_DEPLOY_HOST }}
          port: ${{ secrets.MIRROR_DEPLOY_PORT }}
          username: ${{ secrets.MIRROR_DEPLOY_USER }}
          key: ${{ secrets.MIRROR_DEPLOY_KEY }}
          script: |
            set -euo pipefail
            tag='${{ github.ref_name }}'
            stage='/home/sub2api-client-mirror/staging/${{ github.ref_name }}-${{ github.run_id }}/mirror-release'
            mirror='/opt/sub2api-docs-mirror/cc-switch'
            manifest="$stage/client-download-manifest.json"
            test -f "$manifest"
            jq -r '.assets[] | [(.url | split("/") | last), .sha256] | @tsv' "$manifest" | while IFS=$'\t' read -r file expected; do
              actual=$(sha256sum "$stage/$tag/$file" | awk '{print $1}')
              test "$actual" = "$expected"
            done
            if [ ! -d "$mirror/$tag" ]; then
              mv "$stage/$tag" "$mirror/$tag"
            fi
            install -m 0644 "$manifest" "$mirror/client-download-manifest.json.next"
            mv -f "$mirror/client-download-manifest.json.next" "$mirror/client-download-manifest.json"
            install -m 0644 "$stage/latest.json" "$mirror/latest.json.next"
            mv -f "$mirror/latest.json.next" "$mirror/latest.json"

      - name: Upload versioned assets and site-first manifests
        if: env.RELEASE_CHANNEL == 'stable'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check awscli
          prefix="sub2api-client/$GITHUB_REF_NAME"
          aws --endpoint-url "$OSS_ENDPOINT" s3 sync release-assets/ "s3://$OSS_BUCKET/$prefix/" --only-show-errors
          aws --endpoint-url "$OSS_ENDPOINT" s3 cp client-download-manifest.json "s3://$OSS_BUCKET/sub2api-client/client-download-manifest.json" --content-type application/json --cache-control 'no-cache, no-store' --only-show-errors
          aws --endpoint-url "$OSS_ENDPOINT" s3 cp release-assets/latest.json "s3://$OSS_BUCKET/sub2api-client/latest.json" --content-type application/json --cache-control 'no-cache, no-store' --only-show-errors
